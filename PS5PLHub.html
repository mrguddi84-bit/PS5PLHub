strings.addService=['Dienste hinzufügen','Add services','Añadir servicios','Ajouter des services','Aggiungi servizi','Adicionar serviços'];
strings.emptyHint=['Füge über „Dienste hinzufügen“ deinen ersten Dienst hinzu.','Add your first service using “Add services”.','Añade tu primer servicio con “Añadir servicios”.','Ajoute ton premier service avec « Ajouter des services ».','Aggiungi il primo servizio con “Aggiungi servizi”.','Adiciona o primeiro serviço com “Adicionar serviços”.'];
strings.back=['Zurück zum Hub','Back to hub','Volver al hub','Retour au hub','Torna al hub','Voltar ao hub'];
let lang='de',theme='dark';try{const l=localStorage.getItem('ps5plhub-language'),h=localStorage.getItem('ps5-hub-theme');if(langs.includes(l))lang=l;if(themes.includes(h))theme=h;}catch{}
function t(key,...args){return (strings[key]?.[langs.indexOf(lang)]||strings[key]?.[0]||key).replace(/\{(\d+)\}/g,(_,i)=>String(args[i]??''));}
const uuid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const validIP=ip=>typeof ip==='string'&&/^(10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(ip)&&ip.split('.').every(n=>Number(n)<=255);
const validPort=p=>Number.isInteger(Number(p))&&Number(p)>=1&&Number(p)<=65535;
const validService=s=>s&&typeof s.name==='string'&&s.name.trim().length>0&&s.name.length<=60&&validPort(s.port)&&['http','https'].includes(s.protocol)&&typeof s.path==='string'&&s.path.startsWith('/')&&!s.path.startsWith('//')&&!/[\\\s?#]/.test(s.path)&&s.path.length<300;
const validConfig=s=>s&&typeof s.ip==='string'&&(!s.ip||validIP(s.ip))&&Array.isArray(s.services)&&s.services.length<=100&&s.services.every(validService);
const KEY='ps5plhub-clean-test-v3';const fresh=()=>({ip:'',services:[]});let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(validConfig(saved))state={ip:saved.ip,services:saved.services};}catch{}
let editing=null;const statuses=new Map();
function status(id,key,...args){statuses.set(id,{key,args});$(id).textContent=key?t(key,...args):'';}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{alert(t('storage'));}}
function log(){persist();}
function render(){$('current-ip').textContent=state.ip;$('count').textContent=state.services.length;$('services').replaceChildren();
 if(!state.services.length){const empty=document.createElement('div');empty.className='empty-hub';empty.innerHTML='<div class="empty-icon">⌘</div><h3></h3><p></p>';empty.querySelector('h3').textContent=t('empty');empty.querySelector('p').textContent=t('emptyHint');const add=document.createElement('button');add.className='secondary empty-link';add.textContent=t('addService');add.onclick=()=>editor();empty.append(add);$('services').append(empty);}
 for(const s of [...state.services].sort((a,b)=>new Intl.Collator(lang,{sensitivity:'base',numeric:true}).compare(a.name,b.name)||a.port-b.port)){
 const row=document.createElement('article');row.className='payload-row';
 const url=`${s.protocol}://${state.ip}:${s.port}${s.path}`,link=document.createElement('a');link.className='payload-link';link.href=url;link.title=url;link.target='_blank';link.rel='noopener noreferrer';
 const label=document.createElement('span');label.className='payload-label';label.textContent=s.name;link.append(label);link.onclick=()=>log('opened',s.name);row.append(link);
 const actions=document.createElement('div');actions.className='payload-actions';
 for(const [key,label,action] of [['edit','✎',()=>editor(s)],['remove','×',()=>{if(confirm(t('confirmDelete',s.name))){state.services=state.services.filter(x=>x.id!==s.id);log('deleted',s.name);render();}}]]){const b=document.createElement('button');b.type='button';b.className='secondary payload-action';b.textContent=label;b.title=t(key);b.setAttribute('aria-label',t(key)+' · '+s.name);b.onclick=action;actions.append(b);}
 row.append(actions);$('services').append(row);
 }}
function applyLanguage(){document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-t]').forEach(el=>{if(statuses.has(el.id))return;el.textContent=t(el.dataset.t);});document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));$('theme').setAttribute('aria-label',t('theme'));$('language').setAttribute('aria-label',t('language'));$('import').setAttribute('aria-label',t('import'));for(const [id,s]of statuses)$(id).textContent=s.key?t(s.key,...s.args):'';render();}
function applyTheme(){document.documentElement.dataset.theme=theme;$('theme').value=theme;}
$('language').onchange=()=>{lang=$('language').value;try{localStorage.setItem('ps5plhub-language',lang);}catch{}applyLanguage();};$('theme').onchange=()=>{theme=$('theme').value;try{localStorage.setItem('ps5-hub-theme',theme);}catch{}applyTheme();};
function showSetup(){$('welcome').hidden=false;$('hub').hidden=true;$('ip').value=state.ip;$('back-hub').hidden=!validIP(state.ip);$('ip').focus();}
function showHub(){$('welcome').hidden=true;$('hub').hidden=false;render();status('setup-status','');}
$('change-ip').onclick=showSetup;$('back-hub').onclick=showHub;$('add-service').onclick=()=>editor();
$('console-form').onsubmit=e=>{e.preventDefault();const ip=$('ip').value.trim();if(!validIP(ip))return status('setup-status','invalidIP');state.ip=ip;log('ipSaved');showHub();};
function checkService(s){if(!validService(s))return 'invalidService';if(state.services.some(x=>x.id!==s.id&&x.port===s.port&&x.protocol===s.protocol&&x.path===s.path))return 'duplicate';if(!editing&&state.services.length>=100)return 'limit';return '';}
function editor(s){editing=s?.id||null;$('editor-title').dataset.t=s?'edit':'addService';$('editor-title').textContent=t(s?'edit':'addService');$('name').value=s?.name||'';$('port').value=s?.port||'';status('edit-status','');$('editor').showModal();$('name').focus();}
$('cancel').onclick=()=>{$('editor').close();editing=null;};$('editor').addEventListener('close',()=>editing=null);
$('service-form').onsubmit=e=>{e.preventDefault();const previous=state.services.find(x=>x.id===editing);const s={id:editing||uuid(),name:$('name').value.trim(),port:Number($('port').value),path:previous?.path||'/',protocol:previous?.protocol||'http'};const err=checkService(s);if(err)return status('edit-status',err);if(editing)state.services=state.services.map(x=>x.id===editing?s:x);else state.services.push(s);persist();render();$('editor').close();editing=null;};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({ip:state.ip,services:state.services},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ps5plhub-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('import').onchange=async()=>{const file=$('import').files[0];if(!file)return;try{if(file.size>100000)throw Error();const config=JSON.parse(await file.text());if(!validConfig(config))throw Error();if(!confirm(t('confirmImport')))return;state.ip=config.ip;state.services=config.services.map(s=>({...s,port:Number(s.port),id:uuid()}));log('imported');validIP(state.ip)?showHub():showSetup();}catch{alert(t('badImport'));}finally{$('import').value='';}};
$('reset').onclick=()=>{if(!confirm(t('confirmReset')))return;state=fresh();persist();$('console-form').reset();statuses.clear();status('setup-status','');applyLanguage();showSetup();};
$('year').textContent=new Date().getFullYear();applyTheme();applyLanguage();validIP(state.ip)?showHub():showSetup();
</script></body></html>
