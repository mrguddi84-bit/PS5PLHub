name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PS5PLHub-Android-source.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q PS5PLHub-Android-source.zip

      - name: Build debug APK
        working-directory: PS5PLHub-Android
        run: gradle --no-daemon assembleDebug

      - name: Give APK a clear filename
        run: cp PS5PLHub-Android/app/build/outputs/apk/debug/app-debug.apk PS5PLHub-Android16-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5PLHub-Android16-debug
          path: PS5PLHub-Android16-debug.apk
          retention-days: 30
