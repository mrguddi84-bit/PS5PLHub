name: Build and publish PS5PLHub downloads

on:
  workflow_dispatch:
  push:
    paths:
      - 'PS5PLHub.html'
      - 'PS5PLHub-Android-source.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -oq PS5PLHub-Android-source.zip

      - name: Build debug APK
        working-directory: PS5PLHub-Android
        run: gradle --no-daemon assembleDebug

      - name: Prepare release files
        run: cp PS5PLHub-Android/app/build/outputs/apk/debug/app-debug.apk PS5PLHub-Android16.apk

      - name: Upload only the HTML and APK
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            PS5PLHub.html
            PS5PLHub-Android16.apk
          retention-days: 30

  publish-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" \
            dist/PS5PLHub.html \
            dist/PS5PLHub-Android16.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "PS5PLHub 1.0.${{ github.run_number }}" \
            --notes "PS5PLHub standalone HTML and Android 16 debug APK.\n\nDeutsch: HTML lokal im Browser öffnen. Android APK herunterladen und manuell installieren.\nEnglish: Open the HTML locally in a browser. Download and install the Android APK manually."
